# Fly.io configuration for RunRight Dashboard (Frontend)
# Deploy with: cd web && fly deploy
#
# Custom domain setup (once):
#   fly certs create app.runright.dev --app runright-app
#   # then add a CNAME record: app.runright.dev -> runright-app.fly.dev
#
# Until the api.runright.dev cert/DNS are live, point BACKEND_ORIGIN at the
# backend's fly.dev URL instead so the app keeps working.

app = "runright-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  BACKEND_ORIGIN = "https://api.runright.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
