# Fly.io configuration for RunRight Dashboard (Frontend)
# Deploy with: cd web && fly deploy
#
# NOTE: for the managed "RunRight Cloud" offering (and this reference
# deployment), the dashboard is served directly by runright-api (embedded via
# go:embed — see internal/server/static.go), so this standalone frontend app
# is not part of that flow. Kept for self-hosters who prefer docker-compose
# with backend + frontend as separate containers (see README self-host docs).
#
# No custom domain configured — point BACKEND_ORIGIN at the backend's actual
# fly.dev URL (or your own domain, if you set one up).

app = "runright-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  BACKEND_ORIGIN = "https://runright-api.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
