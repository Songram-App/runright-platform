# Fly.io configuration for RunRight Platform
# Deploy with: fly deploy
#
# Custom domain setup (once):
#   fly certs create api.runright.dev --app runright-api
#   # then add a CNAME record: api.runright.dev -> runright-api.fly.dev

app = "runright-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.backend"

[env]
  PORT = "8080"
  GIN_MODE = "release"
  RUNRIGHT_BASE_URL = "https://api.runright.dev"
  RUNRIGHT_ALLOWED_ORIGINS = "https://app.runright.dev,https://runright.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # Keep running for webhooks
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Health check
[checks]
  [checks.health]
    port = 8080
    type = "http"
    interval = "30s"
    timeout = "5s"
    path = "/healthz"
